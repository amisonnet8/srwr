<svg xmlns="http://www.w3.org/2000/svg" width="638" height="144" viewBox="0 0 638 144" role="img" aria-label="srwr init: settings that are not JSON (stops, changes nothing)"><rect width="638" height="144" fill="#ffffff"/><rect width="638" height="28" fill="#eeeeee"/><text x="12" y="19" fill="#666666" font-size="13" font-family="'Segoe UI',system-ui,sans-serif">srwr init: settings that are not JSON (stops, changes nothing)</text><text x="8" y="51" fill="#795e26" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">$ srwr init</text><text x="8" y="71" fill="#8a5a00" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">srwr init: .claude/settings.json is not valid JSON (near line 3)</text><text x="8" y="91" fill="#8a5a00" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">Nothing was rewritten. Fix the file and run it again.</text><text x="8" y="111" fill="#795e26" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">$ echo $?</text><text x="8" y="131" fill="#1e1e1e" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">1</text></svg>
