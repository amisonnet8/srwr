# golangci-lint v2 configuration (.claude/rules/testing.md).
# Check this file with: golangci-lint config verify
version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - gosec
    # Wrapped errors must be checked with errors.Is / errors.As.
    - errorlint
    - misspell
    - nolintlint
    - nilerr
    - unconvert
    - usestdlibvars

  settings:
    nolintlint:
      require-explanation: true
      require-specific: true

    misspell:
      locale: US

  exclusions:
    rules:
      # Tests create temporary files and run commands freely.
      - path: _test\.go$
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/amisonnet8/srwr
