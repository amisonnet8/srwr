<svg xmlns="http://www.w3.org/2000/svg" width="945" height="244" viewBox="0 0 945 244" role="img" aria-label="srwr init: empty workspace (git)"><rect width="945" height="244" fill="#1e1e1e"/><rect width="945" height="28" fill="#2d2d2d"/><text x="12" y="19" fill="#8a8a8a" font-size="13" font-family="'Segoe UI',system-ui,sans-serif">srwr init: empty workspace (git)</text><text x="8" y="51" fill="#dcdcaa" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">$ srwr init</text><text x="8" y="71" fill="#d4d4d4" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">Workspace: /home/me/project</text><text x="8" y="91" fill="#d4d4d4" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre"></text><text x="8" y="111" fill="#d4d4d4" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">  created    .srwr/               key .srwr/key created</text><text x="8" y="131" fill="#d4d4d4" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">  created    .mcp.json            registered srwr mcp</text><text x="8" y="151" fill="#d4d4d4" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">  created    .claude/settings.json  registered the hook; forbade Edit, Write, etc. (strict mode)</text><text x="8" y="171" fill="#d4d4d4" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">  appended   .gitignore           .srwr/key .srwr/lock .srwr/active .srwr/init-backup/</text><text x="8" y="191" fill="#d4d4d4" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre"></text><text x="8" y="211" fill="#6a9955" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">Ready. Reopen Claude Code and select / replace are available.</text><text x="8" y="231" fill="#8a8a8a" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">For lenient mode (Edit and Write stay allowed), run: srwr init --lenient.</text></svg>
