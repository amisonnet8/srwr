<svg xmlns="http://www.w3.org/2000/svg" width="888" height="164" viewBox="0 0 888 164" role="img" aria-label="srwr: errors"><rect width="888" height="164" fill="#ffffff"/><rect width="888" height="28" fill="#eeeeee"/><text x="12" y="19" fill="#666666" font-size="13" font-family="'Segoe UI',system-ui,sans-serif">srwr: errors</text><text x="8" y="51" fill="#795e26" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">$ srwr foo</text><text x="8" y="71" fill="#8a5a00" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">srwr: unknown command "foo"</text><text x="8" y="91" fill="#795e26" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">$ srwr view</text><text x="8" y="111" fill="#8a5a00" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">srwr view: Vim not found (vim). Install Vim 9.0.0784 or later, or set SRWR_VIM to its path</text><text x="8" y="131" fill="#795e26" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">$ srwr tapes prune --older-than 3</text><text x="8" y="151" fill="#8a5a00" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">srwr tapes: --older-than "3" must look like 30d or 12h</text></svg>
