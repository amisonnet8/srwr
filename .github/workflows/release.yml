name: Release

# A tag pushed by a person (v0.1.0) is all a release takes
# (.claude/rules/distribution.md): this runs the checks of ci.yml, builds the
# archives of srwr and the .vsix of srwr-view with goreleaser (.goreleaser.yaml),
# attaches them to a draft Release and then publishes it. The Marketplace gets
# the .vsix by hand (dev/publish.md). A run that fails on the way leaves only
# the draft, which the next run for the tag replaces. A tag whose Release is
# already published is left alone, and the run fails.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # to make and publish the Release
    steps:
      - name: Stop if the Release of this tag is published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "::error::The Release of $GITHUB_REF_NAME is already published; it is left as it is. Release a new tag."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser reads the earlier tags for the changelog
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # goreleaser's before hook builds the .vsix with qsoku vsix (Node.js is
      # on ubuntu-latest).
      - name: Install qsoku
        run: go install github.com/amisonnet8/qsoku/cmd/qsoku@latest
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Last, once every file is attached: a person never sees a published
      # Release with files missing.
      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
