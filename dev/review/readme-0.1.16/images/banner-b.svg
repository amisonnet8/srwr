<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="srwr: Search, rewrite, say why, replay">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1b2433"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <!-- the tape: frames in a row, look blue, edit orange, a change from outside purple -->
  <g stroke="#30394a" stroke-width="2"><path d="M90 292H1190"/></g>
  <g>
    <circle cx="150" cy="292" r="9" fill="#4aa3ff"/>
    <circle cx="290" cy="292" r="9" fill="#f0883e"/>
    <circle cx="430" cy="292" r="9" fill="#4aa3ff"/>
    <circle cx="570" cy="292" r="9" fill="#f0883e"/>
    <circle cx="710" cy="292" r="9" fill="#b180d7"/>
    <circle cx="850" cy="292" r="9" fill="#4aa3ff"/>
    <circle cx="990" cy="292" r="9" fill="#f0883e"/>
    <circle cx="1130" cy="292" r="9" fill="#b180d7"/>
  </g>
  <rect x="540" y="280" width="60" height="24" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
  <!-- the logo: a tape reel -->
  <g transform="translate(120,72) scale(6)" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="6" width="19" height="12" rx="2"/>
    <circle cx="8" cy="12" r="2.5"/>
    <circle cx="16" cy="12" r="2.5"/>
    <path d="M6 18l1.5-3M18 18l-1.5-3"/>
  </g>
  <text x="420" y="160" text-anchor="middle" fill="#4aa3ff" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="96" font-weight="700">s</text>
  <text x="420" y="204" text-anchor="middle" fill="#4aa3ff" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700">Search</text>
  <text x="580" y="160" text-anchor="middle" fill="#f0883e" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="96" font-weight="700">r</text>
  <text x="580" y="204" text-anchor="middle" fill="#f0883e" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700">rewrite</text>
  <text x="740" y="160" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="96" font-weight="700">w</text>
  <text x="740" y="204" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700">say why</text>
  <text x="900" y="160" text-anchor="middle" fill="#b180d7" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="96" font-weight="700">r</text>
  <text x="900" y="204" text-anchor="middle" fill="#b180d7" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700">replay</text>
  <text x="300" y="248" fill="#8b949e" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21">AI agents read, search and rewrite files, with a reason for every step.</text>
</svg>
