<svg xmlns="http://www.w3.org/2000/svg" width="1032" height="284" viewBox="0 0 1032 284" role="img" aria-label="srwr --help"><rect width="1032" height="284" fill="#1e1e1e"/><rect width="1032" height="28" fill="#2d2d2d"/><text x="12" y="19" fill="#8a8a8a" font-size="13" font-family="'Segoe UI',system-ui,sans-serif">srwr --help</text><text x="8" y="51" fill="#dcdcaa" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">$ srwr --help</text><text x="8" y="71" fill="#d4d4d4" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">srwr: let an AI edit files with just two commands, select / replace, and record the operations on a tape</text><text x="8" y="91" fill="#d4d4d4" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre"></text><text x="8" y="111" fill="#d4d4d4" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">Usage:</text><text x="8" y="131" fill="#d4d4d4" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">  srwr mcp [--root &lt;workspace&gt;]     MCP server (select / replace). Started by the AI agent</text><text x="8" y="151" fill="#d4d4d4" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">  srwr hook [--root &lt;workspace&gt;]    Record Claude Code hook events (reads JSON on stdin)</text><text x="8" y="171" fill="#d4d4d4" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">  srwr view-server                  View server (started by the editor)</text><text x="8" y="191" fill="#d4d4d4" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">  srwr view [tape] [--live]         Replay in Vim (--root &lt;workspace&gt;)</text><text x="8" y="211" fill="#d4d4d4" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">  srwr init [--lenient]             Set up a workspace for srwr (--lenient: do not forbid Edit and Write)</text><text x="8" y="231" fill="#d4d4d4" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">  srwr tapes [new|prune|path]       List and tidy tapes (--root &lt;workspace&gt;)</text><text x="8" y="251" fill="#d4d4d4" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">  srwr --version                    Version</text><text x="8" y="271" fill="#d4d4d4" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="16" xml:space="preserve" style="white-space:pre">  srwr --help                       This help</text></svg>
