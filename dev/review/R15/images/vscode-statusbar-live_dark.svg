<svg xmlns="http://www.w3.org/2000/svg" width="700" height="150" viewBox="0 0 700 150" role="img" aria-label="Status bar in live, failure hidden (dark)">
<rect x="0" y="0" width="700" height="150" fill="#1e1e1e"/>
<text x="14" y="22" fill="#9d9d9d" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Meiryo',system-ui,sans-serif" font-size="12">Following the newest (failure is hidden: two failures arrive, nothing changes)</text>
<rect x="0" y="32" width="700" height="24" fill="#007acc"/>
<text x="14" y="48" fill="#ffffff" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Meiryo',system-ui,sans-serif" font-size="12">‹ Back</text>
<text x="80" y="48" fill="#ffffff" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Meiryo',system-ui,sans-serif" font-size="12">Forward ›</text>
<text x="160" y="48" fill="#ffffff" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Meiryo',system-ui,sans-serif" font-size="12">5/5</text>
<text x="210" y="48" fill="#ffffff" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Meiryo',system-ui,sans-serif" font-size="12">● LIVE</text>
<text x="14" y="84" fill="#9d9d9d" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Meiryo',system-ui,sans-serif" font-size="12">Looking at an older frame: only the frames that are shown are counted (3 new, not 5)</text>
<rect x="0" y="94" width="700" height="24" fill="#007acc"/>
<text x="14" y="110" fill="#ffffff" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Meiryo',system-ui,sans-serif" font-size="12">‹ Back</text>
<text x="80" y="110" fill="#ffffff" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Meiryo',system-ui,sans-serif" font-size="12">Forward ›</text>
<text x="160" y="110" fill="#ffffff" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Meiryo',system-ui,sans-serif" font-size="12">2/8</text>
<rect x="206" y="94" width="230" height="24" fill="#b45f06"/>
<text x="216" y="110" fill="#ffffff" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP','Meiryo',system-ui,sans-serif" font-size="12">Back to LIVE (3 new)</text>
</svg>
