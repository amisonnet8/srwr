name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these same checks before it builds a release.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install qsoku
        run: go install github.com/amisonnet8/qsoku/cmd/qsoku@latest
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-only: true
      # Go only. The extension has its own job below.
      - name: qsoku go-check
        shell: bash
        run: qsoku go-check

  # -race needs a C compiler, which windows-latest does not have.
  race:
    name: race (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install qsoku
        run: go install github.com/amisonnet8/qsoku/cmd/qsoku@latest
      - name: qsoku race
        shell: bash
        run: qsoku race

  # The VSCode extension (srwr-view). ubuntu-latest has Node.js preinstalled.
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install qsoku
        run: go install github.com/amisonnet8/qsoku/cmd/qsoku@latest
      - name: qsoku ext
        run: qsoku ext

  # The Vim client (Vim 9.0 or later; ubuntu-latest's Vim satisfies it).
  vim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install qsoku
        run: go install github.com/amisonnet8/qsoku/cmd/qsoku@latest
      - name: Install Vim
        run: sudo apt-get update && sudo apt-get install -y vim
      - name: Build srwr
        run: if [ -d cmd/srwr ]; then qsoku bin; fi
      - name: qsoku vim-test
        run: qsoku vim-test

  # The oldest Vim srwr-view.vim supports (9.0.0784) is built from source (qsoku vim-oldest) and runs the same tests.
  vim-oldest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install qsoku
        run: go install github.com/amisonnet8/qsoku/cmd/qsoku@latest
      - name: Install what building Vim needs
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev
      - name: qsoku vim-oldest
        run: qsoku vim-oldest

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install qsoku
        run: go install github.com/amisonnet8/qsoku/cmd/qsoku@latest
      - name: qsoku shellcheck
        run: qsoku shellcheck
      # The decision table of the hook that forces commands through bcuz (jq is on the runner).
      - name: qsoku hook
        run: qsoku hook

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install qsoku
        run: go install github.com/amisonnet8/qsoku/cmd/qsoku@latest
      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: latest
      - name: qsoku trivy
        run: qsoku trivy

  # What is handed to the users, made as release.yml makes it on a tag, but without one (qsoku snapshot): the archives of
  # srwr for six machines, checksums.txt and the .vsix (.goreleaser.yaml; its before hook runs qsoku vsix, which checks it).
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser reads the earlier tags
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install qsoku
        run: go install github.com/amisonnet8/qsoku/cmd/qsoku@latest
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          install-only: true
      - name: qsoku snapshot
        run: qsoku snapshot
